name: Display firmware

on:
  workflow_dispatch:
  push:
    paths:
      - 'display/**'
      - 'tools/w906/API.md'
      - 'tools/w906/fixtures/**'
      - 'vehicle_profiles/mercedes/sprinter_w906_om651.json'
      - '.github/workflows/display.yml'
  pull_request:
    paths:
      - 'display/**'
      - 'tools/w906/API.md'
      - 'tools/w906/fixtures/**'
      - 'vehicle_profiles/mercedes/sprinter_w906_om651.json'
      - '.github/workflows/display.yml'

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Tool tests
        run: python -m unittest -v
        working-directory: display/tools
      - name: Partition table
        run: python display/tools/check_partitions.py --partitions display/partitions.csv --flash-size 16M
      - name: Logic host tests
        # -k: show what is wrong with every test, not only with the first
        run: make -k
        working-directory: display/test
      - name: Red proof counter-check (a change without effect is reported)
        run: python redproof.py --selftest
        working-directory: display/test
      - name: Platform simulations (main.c, screen.c, net.c, web.c and gx.c against the core, with stand-ins for ESP-IDF)
        # Twice: as a PC has char, and as the ESP32 has it. The mutations of the platform files
        # (display/host/platform/redproof.py) are not run here.
        run: |
          make
          make clean
          make EXTRA=-funsigned-char
        working-directory: display/host/platform
      - name: gx_live builds (main/gx.c against the sockets of a PC; not run, there is no broker here)
        run: make
        working-directory: display/host/gx_live

  # Every removed rule has to make a test fail. Thousands of builds: eight parts side by side.
  red-proof:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Red proof, part ${{ matrix.part }} of 8
        run: python redproof.py --shard ${{ matrix.part }}/8
        working-directory: display/test

  # Every kind of screen, and every scene the core makes in its host tests (display/test/fixtures), drawn by
  # LVGL without a display and checked (display/host/render.c). The log shows the screens as text; the
  # pictures are kept, because whether a screen reads well is seen, not tested.
  ui-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: LVGL at the version of the firmware
        # The one version is named in display/main/idf_component.yml
        run: |
          version=$(sed -n 's/^ *version: "==\(.*\)"$/\1/p' display/main/idf_component.yml)
          test -n "$version"
          git clone --depth 1 --branch "v$version" https://github.com/lvgl/lvgl.git "$RUNNER_TEMP/lvgl"
      - name: Render and check the screens
        run: make -j"$(nproc)" LVGL="$RUNNER_TEMP/lvgl"
        working-directory: display/host
      - name: Upload the pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wican-display-screens
          path: display/host/build/out/*.png
          if-no-files-found: ignore

  firmware:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.2
          target: esp32s3
          path: display
          command: idf.py build

      - name: Image leaves a fifth of its slot free
        run: python3 display/tools/check_partitions.py --partitions display/partitions.csv --flash-size 16M --image "display/build/wican-display.bin"

      # A build that succeeds does not show it: without the definition LVGL builds as well, with a loop
      # without end where an assertion fails
      - name: LVGL is compiled with the assertion handler of components/ui (abort, not a loop)
        run: python3 display/tools/check_build.py --commands display/build/compile_commands.json

      # The display reads the broker of a Cerbo GX with a reader of its own that cannot publish
      # (components/core/mqtt_sub.h). That no source calls the MQTT client of ESP-IDF, which can, is not
      # seen at a build that succeeds: the map of the linker names every object that was taken
      - name: No MQTT client is linked into the firmware
        run: python3 display/tools/check_build.py --map display/build/wican-display.map

      # The page is embedded twice, plain and compressed; the compressed one is made by the build. That the
      # build went through does not show that what it embedded unpacks to the page
      - name: The compressed page of the build unpacks to the page
        run: |
          PACKED=$(find display/build -name index.html.gz | head -n 1)
          test -n "$PACKED"
          python3 display/tools/page_gz.py --check display/main/web/index.html "$PACKED"

      # sdkconfig.defaults is a wish list: a name that is misspelt or out of its range is dropped without a word
      - name: The settings of lwIP have arrived in the configuration
        run: |
          grep -x "CONFIG_LWIP_TCP_SND_BUF_DEFAULT=11520" display/sdkconfig
          grep -x "CONFIG_LWIP_TCP_WND_DEFAULT=11520" display/sdkconfig
          grep -x "CONFIG_LWIP_TCP_RECVMBOX_SIZE=10" display/sdkconfig
          grep -x "CONFIG_LWIP_TCP_SACK_OUT=y" display/sdkconfig
          grep -x "CONFIG_ESP_TASK_WDT_PANIC=y" display/sdkconfig

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: wican-display
          path: |
            display/build/wican-display.bin
            display/build/bootloader/bootloader.bin
            display/build/partition_table/partition-table.bin
            display/build/ota_data_initial.bin
            display/build/flash_args

      # Counter-check of the check of the map with the real build system, behind the upload: what is built
      # from here on is thrown away. A source of main/ that calls the MQTT client of ESP-IDF - by a
      # declaration of its own, so no CMakeLists.txt has to name the component - has to make the check fail.
      # The call stands in gx_start(), which the network task calls. In a function of its own that nobody
      # calls it proved nothing: the linker threw that function away and the client with it, and the check
      # was right to find none (the run of 2026-10-12). And the component is named among the requirements
      # of main/: without that the linker does not find the client at all (the second run of that day) -
      # which is the first guard. The check of the map is the second, for the day somebody names it.
      - name: Counter-check, a source calls the MQTT client
        run: |
          sed -i 's/esp_http_client esp_http_server nvs_flash esp_lcd esp_partition$/esp_http_client esp_http_server nvs_flash esp_lcd esp_partition mqtt/' display/main/CMakeLists.txt
          test "$(grep -c "esp_partition mqtt$" display/main/CMakeLists.txt)" = 1
          sed -i 's/^esp_err_t gx_start(void)$/extern void *esp_mqtt_client_init(const void *config);\nesp_err_t gx_start(void)/' display/main/gx.c
          sed -i '/^esp_err_t gx_start(void)$/,/^}/ s/^\tif(running)$/\tif(esp_mqtt_client_init(0) == NULL \&\& running)/' display/main/gx.c
          grep -n "esp_mqtt_client_init" display/main/gx.c
          test "$(grep -c "esp_mqtt_client_init" display/main/gx.c)" = 2

      - name: Counter-check, built again with that source
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.2
          target: esp32s3
          path: display
          command: idf.py build

      - name: Counter-check, the client is reported
        run: |
          if python3 display/tools/check_build.py --map display/build/wican-display.map; then
            echo "the check did not notice the MQTT client in the firmware"
            exit 1
          fi

      # Counter-check of the check of the definition, the same way: nothing is built from here on.
      # Without the line of components/ui/CMakeLists.txt the check has to fail.
      - name: Counter-check, the definition is taken away
        run: |
          grep -c "LV_ASSERT_HANDLER=if" display/components/ui/CMakeLists.txt
          sed -i "/LV_ASSERT_HANDLER=if/d" display/components/ui/CMakeLists.txt
          if grep -q "LV_ASSERT_HANDLER=if" display/components/ui/CMakeLists.txt; then exit 1; fi

      - name: Counter-check, configured again without it
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.2
          target: esp32s3
          path: display
          command: idf.py reconfigure

      - name: Counter-check, its absence is reported
        run: |
          if python3 display/tools/check_build.py --commands display/build/compile_commands.json; then
            echo "the check did not notice that the definition is gone"
            exit 1
          fi
